[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-matching-engine"
version = "0.1.0"
description = "High-throughput limit order book matching and pre-trade risk engine with deterministic audit ledger"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Paul Trafford", email = "228485553+elura172@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
